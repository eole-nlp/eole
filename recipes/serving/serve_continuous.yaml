# Dedicated greedy Responses server; no concurrent ordinary predictor calls.
models_root: ${EOLE_MODEL_DIR}
models:
  - id: qwen3.8-27B
    path: ${QWEN38_MODEL}
    preload: true
    continuous:
      slots: 4
      max_pending: 32
      prefill_chunk_size: 256
      prefill_idle_chunk_size: 512
      compiled: true
    config:
      compute_dtype: bf16
      self_attn_backend: flash
      dynamic_shapes: false
      beam_size: 1
      n_best: 1
      top_k: 1
      top_p: 0.0
      temperature: 1.0
      min_length: 0
      max_length: 256
      max_length_ratio: 0
      context_length: 4096
      batch_size: 1
      self_speculative_decoding: false
      vocabulary_quantization: none
      report_time: true
      fuse_kvq: true
      fuse_gate: true
      prefill_cache_size: 0
      prefill_chunk_size: 256
