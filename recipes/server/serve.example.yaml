# Run from the repository root. Convert the checkpoint first (see README.md).
models_root: "${EOLE_MODEL_DIR}"
models:
  - id: "qwen3.5-0.8B"
    path: "${EOLE_MODEL_DIR}/qwen3.5-0.8B"
    preload: true
    config:
      compute_dtype: bf16
      self_attn_backend: pytorch
      beam_size: 1
      n_best: 1
      top_k: 1
      top_p: 0.0
      max_length: 256
      batch_size: 1
      report_time: true
