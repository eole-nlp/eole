# Initial Codex integration: compiled greedy Qwen, MTP disabled.
models_root: ${EOLE_MODEL_DIR}
models:
- id: qwen3.8-27B
  path: ${QWEN38_MODEL}
  preload: true
  config:
    compute_dtype: bf16
    self_attn_backend: flash
    beam_size: 1
    n_best: 1
    top_k: 1
    top_p: 0.0
    temperature: 1.0
    min_length: 0
    max_length: 4096
    max_length_ratio: 0
    context_length: 28672
    batch_size: 1
    self_speculative_decoding: false
    self_speculative_num_tokens: 3
    report_time: true
    fuse_kvq: false
    fuse_gate: false
    prefill_cache_size: 0
    # Bound long desktop-prompt prefill workspace; prefix reuse stays disabled.
    prefill_chunk_size: 256
