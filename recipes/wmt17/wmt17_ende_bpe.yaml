## IO
save_data: "${WMT17_RUN}/data"
seed: 1234
report_every: 100
valid_metrics: ["BLEU"]

### Vocab
src_vocab: "${WMT17_RUN}/vocab.txt"
tgt_vocab: "${WMT17_RUN}/vocab.txt"
src_vocab_size: 36000
tgt_vocab_size: 36000
vocab_size_multiple: 8
src_words_min_frequency: 2
tgt_words_min_frequency: 2
share_vocab: True
n_sample: 0

data:
    corpus_1:
        path_src: "${WMT17_RUN}/train.en"
        path_tgt: "${WMT17_RUN}/train.de"
    valid:
        path_src: "${WMT17_RUN}/valid.en"
        path_tgt: "${WMT17_RUN}/valid.de"

transforms: [bpe, filtertoolong]
transforms_configs:
  bpe:
    src_subword_model: "${WMT17_RUN}/codes"
    tgt_subword_model: "${WMT17_RUN}/codes"
  filtertoolong:
    src_seq_length: 512
    tgt_seq_length: 512

training:
    # Run configuration
    model_path: "${WMT17_RUN}/model"
    keep_checkpoint: 50
    save_checkpoint_steps: 5000
    average_decay: 0
    train_steps: 50000
    valid_steps: 5000

    # Train on a single GPU
    world_size: 1
    gpu_ranks: [0]

    # Batching
    batch_type: "tokens"
    batch_size: 5000
    valid_batch_size: 4096
    batch_size_multiple: 8
    accum_count: [10]
    accum_steps: [0]

    # Optimizer & Compute
    compute_dtype: "bf16"
    optim: "adamw"
    use_amp: False
    learning_rate: 2
    warmup_steps: 4000
    decay_method: "noam"
    adam_beta2: 0.998

    # Data loading
    bucket_size: 100000
    bucket_size_init: 25000
    bucket_size_increment: 25000
    num_workers: 2
    prefetch_factor: 400

    # Hyperparams
    dropout_steps: [0]
    dropout: [0.1]
    attention_dropout: [0.1]
    max_grad_norm: 0
    label_smoothing: 0.1
    param_init_method: xavier_uniform
    normalization: "tokens"

model:
    architecture: "transformer"
    hidden_size: 1024
    share_decoder_embeddings: true
    share_embeddings: true
    layers: 6
    heads: 16
    transformer_ff: 4096
    embeddings:
        word_vec_size: 1024
        position_encoding_type: "SinusoidalInterleaved"
