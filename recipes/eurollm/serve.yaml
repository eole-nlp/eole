models_root: "." # used only for HF downloads for now, but might override $EOLE_MODEL_DIR at some point
models:
# local model
- id: "EuroLLM-9B-Instruct"
  path: "${EOLE_MODEL_DIR}/EuroLLM-9B-Instruct"
  preload: true
  config:
    compute_dtype: bf16
    self_attn_backend: pytorch
    gpu_ranks: [0]
    world_size: 1
    batch_size: 1
    beam_size: 1
    n_best: 1
    top_k: 1
    top_p: 0.0
    max_length: 512
    context_length: 4096
