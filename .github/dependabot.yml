version: 2
updates:
  - package-ecosystem: npm
    directory: /docs/docusaurus_tsx
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      documentation-transitives:
        dependency-type: indirect
        applies-to: security-updates
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
