name: Build Base Docker Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag or commit (release labels require an exact release tag)"
        required: true
        default: main
        type: string
      torch_version:
        description: "PyTorch version"
        required: true
        default: 2.14.1
        type: string
      cuda_version:
        description: "NVIDIA CUDA devel image version"
        required: true
        default: 13.2.1
        type: string

permissions:
  contents: read
  packages: write

env:
  TORCH_VERSION: ${{ inputs.torch_version }}
  CUDA_VERSION: ${{ inputs.cuda_version }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Require updated Docker tooling
        run: |
          grep -q CUDA_NVCC_PACKAGE docker/build_base.sh
          grep -q VCS_REF docker/build.sh
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish matching base
        run: docker/build_base.sh "$TORCH_VERSION" "$CUDA_VERSION" --push
