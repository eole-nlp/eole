name: Build RunPod Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref containing the RunPod recipe"
        required: true
        default: main
        type: string
      eole_image:
        description: "Published Eole image to extend (matching Torch/CUDA and Eole 0.6.3+)"
        required: true
        default: ghcr.io/eole-nlp/eole:0.6.3-torch2.14.1-ubuntu24.04-cuda13.2.1
        type: string

permissions:
  contents: read
  packages: write

env:
  EOLE_IMAGE: ${{ inputs.eole_image }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and publish
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eole-runpod:dev-$(git rev-parse --short=12 HEAD)"
          docker build -f recipes/runpod/Dockerfile --build-arg "EOLE_IMAGE=$EOLE_IMAGE" \
            --build-arg "VCS_REF=$(git rev-parse HEAD)" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -m py_compile /opt/eole-runpod/launch.py /opt/eole-runpod/gateway.py
          docker push "$IMAGE"
          echo "RunPod image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
