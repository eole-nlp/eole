name: Build RunPod Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref containing the RunPod recipe"
        required: true
        default: "main"
        type: string
      deploy_tag:
        description: "Deployment tag: 0.6.5 for this release (empty publishes dev tag only)"
        required: false
        default: ""
        type: string
      eole_image:
        description: "Newly built Eole image with bundled CUDA ops (matching Torch/CUDA)"
        required: true
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  EOLE_IMAGE: ${{ inputs.eole_image }}
  DEPLOY_TAG: ${{ inputs.deploy_tag }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Validate deployment tag
        run: |
          if [[ -n "$DEPLOY_TAG" && ! "$DEPLOY_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid deployment image tag" >&2
            exit 1
          fi
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check release source and Eole parent
        run: bash recipes/runpod/check_release.sh "$DEPLOY_TAG" "$EOLE_IMAGE"
      - name: Build, smoke-test and publish
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eole-runpod:dev-$(git rev-parse --short=12 HEAD)"
          docker build -f recipes/runpod/Dockerfile --build-arg "EOLE_IMAGE=$EOLE_IMAGE" \
            --build-arg "VCS_REF=$(git rev-parse HEAD)" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -m py_compile /opt/eole-runpod/launch.py /opt/eole-runpod/gateway.py /opt/eole-runpod/checkpoints.py
          docker run --rm --entrypoint python "$IMAGE" -c 'import torch, torchvision; from eole import _ops; print(_ops.__file__)'
          docker run --rm --entrypoint python "$IMAGE" -c 'import json; from pathlib import Path; p=Path("/opt/eole-runpod"); models=json.loads((p/"models.json").read_text()); assert len(models)==4; assert all(len(m["revision"])==40 for m in models.values())'
          docker push "$IMAGE"
          echo "RunPod image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DEPLOY_TAG" ]]; then
            DEPLOY_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eole-runpod:$DEPLOY_TAG"
            docker tag "$IMAGE" "$DEPLOY_IMAGE"
            docker push "$DEPLOY_IMAGE"
            echo "Deploy-button image: \`$DEPLOY_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          fi
