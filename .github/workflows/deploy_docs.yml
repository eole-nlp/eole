name: Deploy Docs

# Trigger manually via Github Actions UI for now, on release later
on: ["workflow_dispatch", "workflow_call"]

jobs:
  build_and_deploy_docs:
    runs-on: ubuntu-22.04
    permissions: write-all
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install Eole
      run: |
        pip install .
    - name: Install docusaurus and deps
      run: |
        cd docs/docusaurus_tsx && corepack yarn install --immutable
    - name: Build docs
      run: |
        cd docs && pip install -r requirements.txt && bash build_docs.sh
    - name: Deploy to Github Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs/docusaurus_tsx/build
        branch: gh-pages-docs
        clean: true
        token: ${{ secrets.GITHUB_TOKEN }}
